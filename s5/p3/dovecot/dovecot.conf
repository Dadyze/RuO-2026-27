# s5/p3: Dovecot (IMAP i LMTP) za ruo.lab. Pokreće se s "dovecot -c" iz namespace-a ruo5-mail,
# pa ne dira eventualni Dovecot na računaru (vlastiti base_dir, log i sandučići).
base_dir = /run/ruo5/dovecot
instance_name = ruo5-dovecot
protocols = imap lmtp
listen = *
log_path = /var/lib/ruo5/dovecot.log

# TLS je obavezan: lozinke nikad ne idu nešifrovano
ssl = required
ssl_cert = </etc/ruo5/mail/tls/mail.crt
ssl_key = </etc/ruo5/mail/tls/mail.key
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login

# korisnici iz datoteke (lozinke kao SHA512-CRYPT hash); svi sandučići pripadaju sistemskom korisniku mail
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/ruo5/mail/dovecot/korisnici
}
userdb {
  driver = static
  args = uid=mail gid=mail home=/var/lib/ruo5/mail/%d/%n
}
first_valid_uid = 8
last_valid_uid = 8
mail_location = maildir:~/Maildir

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}
# Postfix predaje poštu (LMTP) i provjerava prijave (SASL) kroz sockete u svom redu čekanja
service lmtp {
  unix_listener /var/spool/ruo5-postfix/private/dovecot-lmtp {
    user = postfix
    group = postfix
    mode = 0600
  }
}
service auth {
  unix_listener /var/spool/ruo5-postfix/private/auth {
    user = postfix
    group = postfix
    mode = 0660
  }
}
