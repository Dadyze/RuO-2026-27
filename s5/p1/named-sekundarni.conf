// s5/p1: sekundarni DNS server, ruo5-ns2 (10.50.0.54). Nema vlastitih zonskih datoteka u Gitu:
// zone preuzima od primarnog (AXFR/IXFR) kad primi NOTIFY ili kad istekne refresh iz SOA zapisa.
include "keys.conf";

options {
  listen-on { 10.50.0.54; 127.0.0.1; };
  listen-on-v6 { none; };
  pid-file "named.pid";
  session-keyfile "session.key";
  recursion no;
  allow-query { any; };
  allow-transfer { none; };
  dnssec-validation no;
};

controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-ruo"; }; };

logging {
  channel datoteka { file "named.log" versions 2 size 1m; print-time yes; severity info; };
  category default { datoteka; };
  category xfer-in { datoteka; };
  category notify { datoteka; };
};

zone "ruo.lab"              { type secondary; primaries { 10.50.0.53; }; file "sec/db.ruo.lab"; };
zone "0.50.10.in-addr.arpa" { type secondary; primaries { 10.50.0.53; }; file "sec/db.10.50.0"; };
zone "oblak.ruo.lab"        { type secondary; primaries { 10.50.0.53; }; file "sec/db.oblak.ruo.lab"; };
zone "_domainkey.ruo.lab"   { type secondary; primaries { 10.50.0.53; }; file "sec/db._domainkey.ruo.lab"; };
