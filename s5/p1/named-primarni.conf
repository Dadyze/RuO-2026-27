// s5/p1: primarni (autoritativni) DNS server za ruo.lab, ruo5-ns1 (10.50.0.53).
// Relativne putanje su u odnosu na radni direktorij servera (dns.sh ga pokreće u /var/lib/bind/ruo5/ns1).
// TSIG ključevi (keys.conf) se generišu pri pokretanju i nisu u Gitu.
include "keys.conf";

options {
  listen-on { 10.50.0.53; 127.0.0.1; };
  listen-on-v6 { none; };
  pid-file "named.pid";
  session-keyfile "session.key";

  recursion no;                       // samo autoritativni odgovori: ne razrješava tuđe domene
  allow-query { any; };
  allow-transfer { 10.50.0.54; };     // kopiju cijele zone (AXFR) smije uzeti samo sekundarni
  notify yes;                         // nakon promjene javi sekundarnom (NOTIFY), on povlači zonu
  dnssec-validation no;
};

controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-ruo"; }; };

logging {
  channel datoteka { file "named.log" versions 2 size 1m; print-time yes; severity info; };
  category default { datoteka; };
  category xfer-out { datoteka; };
  category notify { datoteka; };
  category update { datoteka; };
};

// statičke zone: datoteka je u Gitu, mijenja se commitom i povećanjem seriala
zone "ruo.lab"              { type primary; file "zone/db.ruo.lab"; };
zone "0.50.10.in-addr.arpa" { type primary; file "zone/db.10.50.0"; };

// dinamičke zone: zapise mijenjaju alati kroz RFC 2136 UPDATE, potpisan TSIG ključem.
// Svaki ključ smije samo svoju zonu (najmanja potrebna prava).
zone "oblak.ruo.lab" {
  type primary; file "dyn/db.oblak.ruo.lab";
  update-policy { grant ruo-tf zonesub ANY; };          // Terraform (s5/p2)
};
zone "_domainkey.ruo.lab" {
  type primary; file "dyn/db._domainkey.ruo.lab";
  update-policy { grant ruo-dkim zonesub TXT; };        // objava DKIM ključa (s5/p3), samo TXT
};
