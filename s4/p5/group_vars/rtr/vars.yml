# Politika mreže kao PODACI: pravila se mijenjaju ovdje, a šablon ih pretvara u nftables.
fw_uplink: r-up
fw_vpn_if: wg-rtr
fw_vpn_port: 51820

fw_segmenti:                     # ime: podmreža
  web: 10.40.1.0/24
  app: 10.40.2.0/24
  db: 10.40.3.0/24

fw_javno:                        # internet -> segment (samo navedeni portovi)
  - { do: web, proto: tcp, portovi: [80, 443] }

fw_pravila:                      # segment -> segment (slojevi: web -> app -> db)
  - { od: web, do: app, proto: tcp, portovi: [8080] }
  - { od: app, do: db,  proto: tcp, portovi: [5432] }

fw_bastion: 10.40.1.10           # jedina adresa s koje je dozvoljen SSH admin pristup app i db slojevima
fw_admin:
  - { do: app, proto: tcp, portovi: [22] }
  - { do: db,  proto: tcp, portovi: [22] }

fw_izlaz: [web, app]             # segmenti kojima je dozvoljen izlaz prema internetu (db nije)
fw_vpn:                          # VPN klijent -> segment
  - { do: app, proto: tcp, portovi: [22, 8080] }

# Pravila se učitavaju u namespace rutera iz s4/p1; na pravom ruteru ostaje samo "nft".
fw_nft_cmd: ip netns exec ruo-rtr nft
fw_dest: /etc/nftables.d/ruo.nft
fw_instaliraj_paket: true

# SSH klijent: unutrašnje mašine su dostupne samo preko bastiona (ProxyJump)
ssh_korisnik: student
ssh_hostovi:
  app1: 10.40.2.2
  db1: 10.40.3.2
