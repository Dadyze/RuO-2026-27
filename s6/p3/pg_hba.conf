# s6/p3: ko se smije spojiti, na koju bazu, odakle i kako (pg_hba = host-based authentication).
# Pravila se čitaju odozgo: vrijedi PRVO koje odgovara, pa je zadnji red "sve ostalo odbij".
#
# TIP    BAZA          KORISNIK         ADRESA          METODA
local    all           all                              peer            # admin: OS korisnik preko unix socketa
host     prodavnica    app,izvjestaj    127.0.0.1/32    scram-sha-256   # aplikacija i izvještaji: samo svoja baza
host     all           backup           127.0.0.1/32    scram-sha-256   # pg_dump: čita sve baze
host     replication   repl             127.0.0.1/32    scram-sha-256   # replika i pg_basebackup
host     all           all              0.0.0.0/0       reject          # sve ostalo: odbijeno
