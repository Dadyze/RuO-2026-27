# s6/p3: postavke koje dodajemo na zadani postgresql.conf (baza.sh dodaje red: include '.../postgresql.ruo.conf').
# Port i direktorij socketa zadaje pg_ctl (-p, -k), pa ista datoteka služi primarnoj instanci, replici i restore-u.

listen_addresses = '127.0.0.1'        # samo lokalno; na serveru: privatna adresa, nikad 0.0.0.0 bez vatrozida
password_encryption = scram-sha-256   # lozinke se čuvaju kao SCRAM hash (ne MD5)
max_connections = 50

# replikacija: primarni šalje WAL (dnevnik izmjena) replikama
wal_level = replica                   # u WAL ide dovoljno podataka za repliku i za PITR
max_wal_senders = 5                   # koliko replika/pg_basebackup veza istovremeno
max_replication_slots = 5             # slot čuva WAL dok ga replika ne preuzme
hot_standby = on                      # replika prima upite za čitanje dok primjenjuje WAL

shared_buffers = 64MB                 # lab: malo memorije
log_line_prefix = '%m [%p] %u@%d '    # vrijeme, proces, korisnik@baza u dnevniku
log_connections = on
